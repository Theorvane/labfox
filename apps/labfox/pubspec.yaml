name: labfox
description: A cross-platform GitLab workflow client.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  design_system:
    path: ../../packages/design_system
  dio: ^5.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_web_auth_2: ^4.0.0
  gitlab_api:
    path: ../../packages/gitlab_api
  gitlab_models:
    path: ../../packages/gitlab_models
  go_router: ^14.6.0
  intl: any
  secure_storage:
    path: ../../packages/secure_storage
  shared_preferences: ^2.3.3

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
