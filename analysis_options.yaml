# Shared analysis rules. Every package points here so a lint cannot be enabled
# in one corner of the monorepo and not another.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # CI runs `flutter analyze --fatal-infos`, so anything that should block a
    # merge is raised to a warning or error here rather than left as an info.
    todo: ignore
    # freezed models declare fields as constructor parameters, which is the
    # only place @JsonKey can go. json_serializable forwards the annotation
    # correctly; the analyzer just cannot see that. Silenced here rather than
    # at each model, because every model LabFox adds would repeat it.
    invalid_annotation_target: ignore
    missing_required_param: error
    missing_return: error
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - unawaited_futures
    - use_super_parameters
