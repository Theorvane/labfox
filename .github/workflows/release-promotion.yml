name: release-promotion

# main is the release branch: landing on it triggers release.yml. Only the
# repository's own dev branch may promote, so a fork or a feature branch cannot
# open a pull request that would publish to the stores if merged.
# See AGENTS.md §11.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-promotion:
    name: Only dev may promote to main
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      BASE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Require the repository-owned dev integration branch
        run: |
          set -euo pipefail
          if [ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]; then
            echo "::error::A fork cannot promote to main. Open the pull request against dev."
            exit 1
          fi
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::main only accepts promotions from dev; this one is from '$HEAD_REF'."
            exit 1
          fi
