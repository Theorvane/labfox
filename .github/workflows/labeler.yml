name: Labeler

# pull_request_target, not pull_request: labelling a fork's pull request needs a
# write-scoped token, which pull_request does not grant. This is safe here only
# because the job never checks out or executes the contributor's code — it just
# maps changed paths to labels.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply area labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
