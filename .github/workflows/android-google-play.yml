name: Android Google Play

on:
  workflow_call:
    inputs:
      track:
        type: string
        required: true
      release_status:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: google-play-${{ inputs.track }}
  cancel-in-progress: false

jobs:
  upload:
    name: Build and upload the Android app
    runs-on: ubuntu-24.04
    environment: play-store
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.9
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # build.gradle.kts reads android/key.properties and falls back to debug
      # keys when it is absent — which Play rejects, silently producing an
      # unshippable artifact. Write it here, and fail loudly if any part of the
      # key is missing rather than building something that cannot be uploaded.
      - name: Install the upload key
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/labfox-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          umask 077
          cat > apps/labfox/android/key.properties <<PROPS
          storeFile=$KEYSTORE_PATH
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS

      - name: Build the signed app bundle
        working-directory: apps/labfox
        run: flutter build appbundle --release

      # A debug-signed bundle builds successfully and is only rejected on
      # upload, so check the certificate here rather than finding out from Play.
      - name: Verify it is not signed with debug keys
        run: |
          set -euo pipefail
          AAB=apps/labfox/build/app/outputs/bundle/release/app-release.aab
          OWNER="$(keytool -printcert -jarfile "$AAB" | grep -m1 'Owner:')"
          echo "$OWNER"
          case "$OWNER" in
            *"CN=Android Debug"*)
              echo "::error::The bundle is signed with debug keys; the upload key was not applied."
              exit 1
              ;;
          esac

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sloki9637.labfox
          releaseFiles: apps/labfox/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.release_status }}
